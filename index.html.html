<title>Performance do Motorista CRG</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --plane:#eaeef0; --surf:#ffffff; --surf2:#f4f7f8; --surf3:#e8edef;
  --ink:#0f1a21; --ink2:#4d5f6b; --ink3:#7d8f9b; --line:#d8e0e4; --line2:#c3cfd5;
  --acc:#0d6875; --acc2:#0a505a; --accbg:#e2f0f2;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --goodink:#0a7a28; --warnink:#8a5a00; --critink:#a82d2d;
  --goodbg:#e6f4e9; --warnbg:#fdf2dc; --critbg:#fbe8e7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(15,26,33,.06),0 4px 12px rgba(15,26,33,.05);
  --onst:#ffffff; --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0a0f13; --surf:#131c22; --surf2:#18242b; --surf3:#1f2e37;
  --ink:#e9f1f4; --ink2:#a0b3bd; --ink3:#71858f; --line:#243440; --line2:#31454f;
  --acc:#40a9b5; --acc2:#63c2cd; --accbg:#10333a;
  --good:#2fbf3a; --warn:#fab219; --crit:#e56060;
  --goodink:#5fd06a; --warnink:#f0bb45; --critink:#f08a8a;
  --goodbg:#12301a; --warnbg:#33280d; --critbg:#3a1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --onst:#080f14;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0a0f13; --surf:#131c22; --surf2:#18242b; --surf3:#1f2e37;
  --ink:#e9f1f4; --ink2:#a0b3bd; --ink3:#71858f; --line:#243440; --line2:#31454f;
  --acc:#40a9b5; --acc2:#63c2cd; --accbg:#10333a;
  --good:#2fbf3a; --warn:#fab219; --crit:#e56060;
  --goodink:#5fd06a; --warnink:#f0bb45; --critink:#f08a8a;
  --goodbg:#12301a; --warnbg:#33280d; --critbg:#3a1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --onst:#080f14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 72px}
header{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hdr{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand img{height:38px;width:auto;display:block;flex:none}
.brand .div{width:1px;align-self:stretch;background:var(--line);margin:2px 0}
.brand .tt{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.brand h1{font-size:19px;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.filters{background:var(--surf2);border-bottom:1px solid var(--line)}
.fbar{max-width:1280px;margin:0 auto;padding:11px 20px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
select,input[type=text],input[type=number]{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surf);
  border:1px solid var(--line2);border-radius:7px;padding:6px 9px;min-width:130px}
input[type=number]{width:82px;font-family:"IBM Plex Mono",monospace;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font:500 12px/1 "IBM Plex Sans",sans-serif;padding:7px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line2);background:var(--surf);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onst)}
.chip.g[aria-pressed="true"]{background:var(--goodink);border-color:var(--goodink)}
.chip.a[aria-pressed="true"]{background:var(--warnink);border-color:var(--warnink)}
.chip.c[aria-pressed="true"]{background:var(--critink);border-color:var(--critink)}
.chip.i[aria-pressed="true"]{background:var(--ink3);border-color:var(--ink3)}
.reset{margin-left:auto;font:500 12.5px "IBM Plex Sans",sans-serif;background:none;border:none;
  color:var(--acc);cursor:pointer;padding:7px 0;text-decoration:underline;text-underline-offset:3px}
.fnote{font-size:12px;color:var(--ink3);padding:0 20px 10px;max-width:1280px;margin:0 auto}
nav.tabs{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:var(--hdrh,60px);z-index:30;overflow-x:auto}
.tabin{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;white-space:nowrap}
.tab{font:600 13.5px Archivo,sans-serif;background:none;border:none;border-bottom:2.5px solid transparent;
  color:var(--ink3);padding:12px 13px;cursor:pointer;letter-spacing:-.01em}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:18px}
.card > h2{font-size:16.5px;font-weight:700}
.card > .cap,.cap{font-size:13px;color:var(--ink2);margin:5px 0 0;max-width:74ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2 > .card{margin-top:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surf);padding:15px 17px 16px}
.kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:Archivo,sans-serif;font-weight:700;font-size:29px;line-height:1.12;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .u{font-size:14px;font-weight:600;color:var(--ink3);margin-left:3px}
.kpi .sm{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.g .v{color:var(--goodink)} .kpi.a .v{color:var(--warnink)} .kpi.c .v{color:var(--critink)}
.st{display:inline-flex;align-items:center;gap:5px;font:600 11.5px "IBM Plex Sans",sans-serif;padding:3px 8px;border-radius:5px;white-space:nowrap}
.st .dot{width:7px;height:7px;border-radius:50%;flex:none}
.st.Alta{background:var(--goodbg);color:var(--goodink)} .st.Alta .dot{background:var(--good)}
.st.Media{background:var(--warnbg);color:var(--warnink)} .st.Media .dot{background:var(--warn)}
.st.Baixa{background:var(--critbg);color:var(--critink)} .st.Baixa .dot{background:var(--crit)}
.st.NC{background:var(--surf3);color:var(--ink2)} .st.NC .dot{background:var(--ink3)}
.tw{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 10.5px "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  text-align:left;padding:9px 11px;background:var(--surf2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
th.r,td.r{text-align:right}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surf2)}
td.mono,th.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.lnk{background:none;border:none;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:"IBM Plex Mono",monospace;font-weight:600}
.neg{color:var(--critink);font-weight:600} .pos{color:var(--goodink);font-weight:600}
.mbar{height:7px;border-radius:3px;background:var(--surf3);position:relative;min-width:60px;overflow:hidden}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:block}
.chart{margin-top:14px;position:relative}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.axis{fill:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.axl{fill:var(--ink2);font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;font-weight:500}
.dlab{fill:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
.gl{stroke:var(--line);stroke-width:1}
.refline{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.sw.ln{height:3px;width:16px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--surf);border:1px solid var(--line2);border-radius:7px;
  padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;z-index:20;min-width:130px;color:var(--ink)}
.tip b{font-family:"IBM Plex Mono",monospace}
.note{background:var(--surf2);border-left:3px solid var(--acc);border-radius:0 7px 7px 0;padding:12px 15px;font-size:13.5px;color:var(--ink2);margin-top:14px}
.note.w{border-left-color:var(--warn)} .note.c{border-left-color:var(--crit)}
.note b,.note strong{color:var(--ink)}
.seg{display:inline-flex;background:var(--surf2);border:1px solid var(--line2);border-radius:8px;padding:2.5px;gap:2px;flex-wrap:wrap}
.seg button{font:600 12.5px "IBM Plex Sans",sans-serif;border:none;background:none;color:var(--ink2);padding:6px 13px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hd{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.prio{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;
  font:700 11.5px "IBM Plex Mono",monospace;color:var(--onst);flex:none}
.p1{background:var(--critink)} .p2{background:var(--warnink)} .p3{background:var(--acc)} .p4{background:var(--ink3)}
.empty{padding:40px 10px;text-align:center;color:var(--ink3);font-size:14px}
.tag{display:inline-block;font:600 10.5px "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.05em;
  background:var(--surf3);color:var(--ink2);padding:3px 7px;border-radius:4px}
ul.cl{margin:9px 0 0;padding-left:19px;font-size:13.5px;color:var(--ink2)}
ul.cl li{margin-bottom:5px}
section[hidden]{display:none}
.spark{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:14px}
.spark .pn{border:1px solid var(--line);border-radius:8px;padding:12px 12px 8px;background:var(--surf2)}
.spark .pn h4{font-size:13px;font-family:"IBM Plex Mono",monospace;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.spark .pn h4 span{font:500 11px "IBM Plex Sans",sans-serif;color:var(--ink3)}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media(max-width:760px){.podio{grid-template-columns:1fr}}
.pod{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surf2);text-align:center;position:relative}
.pod.p1{background:linear-gradient(180deg,var(--warnbg),var(--surf2));border-color:var(--warn)}
.pod .med{font-size:30px;line-height:1}
.pod .nm{font:700 15px Archivo,sans-serif;margin-top:6px;text-wrap:balance}
.pod .sc{font-family:Archivo,sans-serif;font-weight:700;font-size:34px;margin-top:4px;font-variant-numeric:tabular-nums}
.pod .dt{font-size:12px;color:var(--ink2);margin-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surf2);flex:1 1 240px}
.badge .ic{font-size:22px;line-height:1}
.badge .tx{font-size:12.5px;color:var(--ink2)}
.badge .tx b{display:block;font:600 13.5px "IBM Plex Sans",sans-serif;color:var(--ink)}
.gauge{display:flex;align-items:center;gap:12px;margin-top:6px}
.gauge .track{flex:1;height:10px;border-radius:5px;background:var(--surf3);overflow:hidden;position:relative}
.gauge .fill{height:100%;border-radius:5px}
.gauge .val{font:700 20px Archivo,sans-serif;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.comp{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin-top:10px}
.comp .cn{font-size:13px}
.comp .cb{grid-column:1/2;height:8px;border-radius:4px;background:var(--surf3);overflow:hidden}
.comp .cb i{display:block;height:100%;background:var(--acc);border-radius:4px}
.comp .cv{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;white-space:nowrap}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.blk{border:1px solid var(--line);border-radius:var(--r);padding:15px;background:var(--surf2)}
.blk h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.prio2{display:inline-flex;align-items:center;gap:5px;font:600 11.5px "IBM Plex Sans",sans-serif;padding:3px 8px;border-radius:5px;white-space:nowrap}
.pA{background:var(--critbg);color:var(--critink)} .pM{background:var(--warnbg);color:var(--warnink)} .pB{background:var(--goodbg);color:var(--goodink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

     +'<td class="r mono '+(v.difp==null?'':v.difp<0?'neg':'pos')+'">'+(v.difp==null?'—':sgn(v.difp,1)+'%')+'</td>'
     +'<td>'+(v.classe?'<span class="st '+((v.classe==='na'||v.classe==='acima')?'Alta':v.classe==='abaixo'?'Media':'Baixa')+'"><span class="dot"></span>'+esc(v.classeNome)+'</span>':'<span class="tag">—</span>')+'</td>'
     +'<td class="r mono">'+(v.custo?rs(v.custo):'—')+'</td>'
     +'<td class="r mono">'+(v.ckm?'R$ '+n2(v.ckm):'—')+'</td>'
     +'<td class="r mono"'+(v.cl<20?' style="color:var(--critink);font-weight:600"':'')+'>'+n0(v.cl)+'%</td>'

  });
  return h+'</tbody></table></div>';
}

function vRanking(C,V,T,M){
  let W=V.slice();
  if(S.rank==='piores') W.sort((a,b)=>(a.difp==null)-(b.difp==null)||a.difp-b.difp);
  else if(S.rank==='melhores') W.sort((a,b)=>(a.difp==null)-(b.difp==null)||b.difp-a.difp);
  else if(S.rank==='litros') W.sort((a,b)=>(b.L||0)-(a.L||0));
  else W.sort((a,b)=>(b.km||0)-(a.km||0));
  let h='<div class="card"><div class="hd"><div><h2>Ranking por placa</h2>'
   +'<p class="cap">Clique na placa para filtrar a página inteira por ela. Completude é o percentual de leituras da placa que trouxeram o contador de litros — abaixo de 20% o indicador não é calculado.</p></div>'
   +'<div class="seg" id="segrank">'
   +['piores','Piores vs referência','melhores','Melhores vs referência','litros','Maior consumo','km','Maior rodagem']
      .reduce((a,x,i,arr)=>i%2?a:a+'<button data-r="'+x+'" aria-pressed="'+(S.rank===x)+'">'+arr[i+1]+'</button>','')
   +'</div></div>'+tabelaPlacas(W)+'</div>';
  const nc=V.filter(v=>v.q==='Nao calculavel').length;
  if(!S.st.has('Nao calculavel')&&nc===0)
    h+='<div class="note">Há <b>'+D.veic.filter(v=>v.q==='Nao calculavel').length+' placas</b> fora desta lista por não terem telemetria CAN de combustível no export — 48 implementos e carretas e mais algumas com o contador vazio. '
      +'Ative o filtro <b>Não calculável</b> para vê-las. Nenhuma delas é "consumo zero".</div>';
  return h;
}

   +'<div class="chart">'+hbars(Object.keys(tp).sort((a,b)=>tp[b]-tp[a]).map(k=>({lb:k.length>34?k.slice(0,32)+'…':k,v:tp[k],c:'var(--acc)',vl:n0(tp[k]),
      tip:esc(k)+'<br><b>'+tp[k]+'</b> ocorrências'})),{w:600,lw:210,rw:64,labelRight:true,aria:'anomalias por tipo'})+'</div>';
  const sus=V.filter(v=>v.qb>=5).sort((a,b)=>b.qb-a.qb);
  if(sus.length) h+='<div class="note c"><b>Sensor de nível suspeito:</b> '
    +sus.map(v=>v.p+' ('+v.ab+' abastecimentos e '+v.qb+' quedas em 5 dias)').join(' · ')
    +'. Esse padrão não é operação — é leitura instável. Abrir chamado antes de usar o km/l dessas placas.</div>';
  h+='<div class="tw"><table><thead><tr><th>Placa</th><th>Classificação</th><th>Data/hora</th>'
   +'<th class="r">Antes</th><th class="r">Depois</th><th class="r">Variação</th><th>Regra aplicada</th></tr></thead><tbody>';

    h+='<tr><td><button class="lnk" data-pl="'+a[0]+'">'+a[0]+'</button></td><td>'+esc(a[1])+'</td>'
     +'<td class="mono">'+a[2]+'</td><td class="r mono">'+n0(a[4])+'</td><td class="r mono">'+n0(a[5])+'</td>'
     +'<td class="r mono '+(a[6]<0?'neg':'pos')+'">'+sgn(a[6],0)+' '+esc(a[7].replace('% nivel','pp'))+'</td>'

function vDia(C,V,T,M){
  const cats=diasSel().map(dlab);
  const U=V.filter(v=>v.usavel&&v.diasComDado);
  let W=U.slice();
  if(S.diaOrd==='kml') W.sort((a,b)=>(a.difp==null)-(b.difp==null)||a.difp-b.difp);
  else if(S.diaOrd==='osc') W.sort((a,b)=>{
    const f=x=>{const k=x.serie.map(s=>s.kml).filter(Boolean);return k.length>1?Math.max.apply(null,k)-Math.min.apply(null,k):-1;};
    return f(b)-f(a);});
  else W.sort((a,b)=>(b.L||0)-(a.L||0));

  let h='<div class="card"><div class="hd"><div><h2>Rendimento dia a dia por placa</h2>'
   +'<p class="cap">Cada painel é uma placa, um ponto por dia: km do dia ÷ litros do dia, ambos vindos do contador CAN. '
   +'A faixa sombreada é o intervalo esperado do modelo; a linha âmbar é o piso de serra e tráfego pesado. Dia sem ponto é dia sem rodagem, sem transmissão, ou com km/l fora da faixa física — nunca consumo zero.<br>'
   +'<b style="color:var(--s2)">O anel laranja e o traço no eixo marcam os dias em que houve abastecimento</b> — nesses dias o trecho costuma ficar aberto (parte do tanque entra e parte do km sai só no dia seguinte), então uma queda ou um pico isolado ali normalmente é artefato de corte, não condução.</p></div>'
   +'<div class="seg" id="segdia">'
   +'<button data-d="kml" aria-pressed="'+(S.diaOrd==='kml')+'">Piores vs referência</button>'
   +'<button data-d="osc" aria-pressed="'+(S.diaOrd==='osc')+'">Maior oscilação</button>'
   +'<button data-d="litros" aria-pressed="'+(S.diaOrd==='litros')+'">Maior consumo</button>'
   +'</div></div>';
  if(cats.length<2) h+='<div class="note w">Com um único dia selecionado não há série para desenhar. Os painéis abaixo mostram o ponto isolado; amplie o período para ver a tendência.</div>';
  if(!W.length) h+='<p class="empty">Nenhuma placa com rendimento apurável no período.</p>';
  else{
    h+='<div class="spark">';
    W.slice(0,15).forEach(v=>{
      const k=v.serie.map(s=>s.kml).filter(Boolean);
      const amp=k.length>1?Math.max.apply(null,k)-Math.min.apply(null,k):null;
      const mots=v.motoristas||[];
      h+='<div class="pn"><h4>'+v.p+'<span>'+esc(v.m||'—')+' · '+(v.kml?n2(v.kml)+' km/l no período':'—')+'</span></h4>'
        +(mots.length?'<div style="font-size:11.5px;color:var(--ink2);margin:-2px 0 4px">'
          +mots.map(m=>'<button class="lnk" data-mot="'+esc(m)+'" style="font-family:inherit;font-weight:500">'+esc(m)+'</button>').join(' · ')+'</div>':'')
        +'<div class="chart">'+lineChart([{nome:v.p,c:corCl(v.classe)||'var(--acc)',
            pts:v.serie.map(s=>s.kml),
            ab:v.serie.map(s=>s.ab),
            ex:v.serie.map(s=>s.km?n0(s.km)+' km · '+n0(s.L)+' L'+(s.mot?'<br>'+s.mot:''):'')}],
            cats,{w:400,h:150,ref:v.fx?null:v.ref,band:v.fx?v.fx.alvo:null,piso:v.fx?v.fx.piso:null,aria:'rendimento diário de '+v.p})+'</div>'
        +'<div style="font-size:11.5px;color:var(--ink3);margin-top:2px">'
        +v.diasComDado+' de '+cats.length+' dias com dado'+(amp?' · oscilação de '+n2(amp)+' km/l entre o melhor e o pior dia':'')
        +(v.diasAbast?' · <b style="color:var(--s2)">'+v.diasAbast+' dia(s) com abastecimento</b>':'')
        +(v.diasFora?' · <b style="color:var(--warnink)">'+v.diasFora+' dia(s) descartado(s)</b> por km/l fora da faixa física':'')+'</div></div>';
    });
    h+='</div>';
    h+='<div class="legend"><span><i class="sw" style="background:var(--good)"></i>na faixa ou acima</span>'
     +'<span><i class="sw" style="background:var(--warn)"></i>abaixo da faixa</span>'
     +'<span><i class="sw" style="background:var(--crit)"></i>abaixo do piso</span>'
     +'<span><i class="sw" style="background:var(--accbg);border:1px solid var(--line2)"></i>faixa esperada do modelo</span>'
     +'<span><i class="sw ln" style="background:var(--warn)"></i>piso de serra / tráfego pesado</span>'
     +'<span><i class="sw" style="background:transparent;border:2px solid var(--s2);border-radius:50%;width:13px;height:13px"></i>dia com abastecimento</span></div>';
    if(W.length>15) h+='<div class="note">Mostrando 15 placas. Use o filtro de placa ou de modelo para ver as demais.</div>';
  }
  h+='</div>';

  // matriz placa x dia
  h+='<div class="card"><h2>Matriz de km/l por placa e dia</h2>'
   +'<p class="cap">Verde = dentro da faixa esperada do modelo ou acima. Âmbar = abaixo da faixa mas ainda dentro do piso de serra. Vermelho = abaixo de qualquer faixa. '
   +'Traço = sem rodagem ou sem transmissão no dia. <b style="color:var(--warnink)">!</b> = km/l bruto fora da faixa física de 0,8 a 6,0 km/l — descartado, porque um dos dois contadores não fechou o dia. '
   +'<b style="color:var(--s2)">&#9679;</b> = houve abastecimento naquele dia.</p>'
   +'<div class="tw"><table><thead><tr><th>Placa</th><th>Modelo</th>';
  cats.forEach(c=>h+='<th class="r">'+c+'</th>');
  h+='<th class="r">Período</th><th class="r">Faixa esperada</th><th class="r">Dias c/ dado</th></tr></thead><tbody>';
  W.forEach(v=>{
    h+='<tr><td><button class="lnk" data-pl="'+v.p+'">'+v.p+'</button></td><td style="font-size:12.5px">'+esc(v.m||'—')+'</td>'
     +'<td style="font-size:12px">'+((v.motoristas||[]).length?(v.motoristas).map(m=>'<button class="lnk" data-mot="'+esc(m)+'" style="font-family:inherit;font-weight:500">'+esc(m)+'</button>').join('<br>'):'<span style="color:var(--ink3)">sem romaneio</span>')+'</td>';
    v.serie.forEach((s,i)=>{
      if(!s.kml){h+='<td class="r mono" style="color:'+(s.fora?'var(--warnink)':'var(--ink3)')+'"'
        +(s.fora?' title="km/l bruto de '+n2(s.bruto)+' — fora da faixa física de 0,8 a 6,0. Um dos dois contadores não fechou o dia."':'')
        +'>'+(s.fora?'!':'—')+'</td>';return;}
      const cl=classifica(s.kml,v.fx,v.ref);
      const bg=cl==null?'':(cl==='na'||cl==='acima')?'var(--goodbg)':cl==='abaixo'?'var(--warnbg)':'var(--critbg)';
      const fg=cl==null?'':(cl==='na'||cl==='acima')?'var(--goodink)':cl==='abaixo'?'var(--warnink)':'var(--critink)';
      h+='<td class="r mono" style="background:'+bg+';color:'+fg+';font-weight:600" title="'+n0(s.km)+' km · '+n0(s.L)+' L'+(s.ab?' · '+s.ab+' abastecimento(s) no dia':'')+(s.mot?' · '+s.mot:'')+'">'+n2(s.kml)
        +(s.ab?'<sup style="color:var(--s2)" title="dia com abastecimento">&#9679;</sup>':'')+'</td>';
    });
    h+='<td class="r mono" style="font-weight:700">'+(v.kml?n2(v.kml):'—')+'</td>'
     +'<td class="r mono" style="font-size:12.5px">'+(v.fx?n1(v.fx.alvo[0])+'–'+n1(v.fx.alvo[1]):(v.ref?n2(v.ref):'—'))+'</td>'
     +'<td class="r mono">'+v.diasComDado+'/'+cats.length+'</td></tr>';
  });
  h+='</tbody></table></div>'
   +'<div class="note">Um dia isolado ruim quase sempre é rota, carga ou relevo — não condução. O que vale investigar é a placa que fica <b>abaixo da referência em quase todos os dias</b>, e a que oscila muito entre dias parecidos.</div></div>';
  return h;
}

function vCusto(C,V,T,M){
  const U=V.filter(v=>v.usavel&&v.L);
  const comT=U.filter(v=>v.tkm&&v.pesoT);
  const L=U.reduce((a,v)=>a+v.L,0), km=U.reduce((a,v)=>a+v.km||0,0);
  const custo=L*S.preco;
  const tkm=comT.reduce((a,v)=>a+v.tkm,0), pesoT=comT.reduce((a,v)=>a+v.pesoT,0);
  const custoT=comT.reduce((a,v)=>a+v.custo,0);
  const frete=U.reduce((a,v)=>a+(v.frete||0),0);
  const rs_tkm=tkm?custoT/tkm:null, rs_t=pesoT?custoT/pesoT:null;

  let h='<div class="kpis">'
  +kpi('','Custo de diesel',rs(custo),'',n0(L)+' L a R$ '+n2(S.preco)+'/L')
  +kpi('','Custo por quilômetro',km?'R$ '+n2(custo/km):'—','','só distância — ignora o quanto foi carregado')
  +kpi('','Custo por tonelada',rs_t?'R$ '+n2(rs_t):'—','','diesel ÷ carga despachada, nas placas com romaneio')
  +kpi('','Custo por tonelada-quilômetro',rs_tkm?'R$ '+n3(rs_tkm):'—','','a métrica que compara rotas diferentes de forma justa')
  +'</div>';

  h+='<div class="note w" style="margin-top:18px"><b>Como a tonelada-quilômetro foi calculada — leia antes de usar:</b> '
   +'para cada dia, multipliquei o km rodado pela carga do romaneio vigente naquela placa. '
   +'Isso <b>superestima</b> a eficiência real em dois pontos: o retorno vazio entra como se estivesse carregado, e o PESO CALCULO do SSW é o peso de tarifação, que pode ser cubado e não o peso real da nota. '
   +'Trate o número como <b>t·km aparente</b> — ele serve para comparar placas e motoristas entre si no mesmo período, não para fechar custo contábil.</div>';

  if(!comT.length){h+='<p class="empty">Nenhuma placa com carga e consumo no recorte atual.</p>';return h;}

  h+='<div class="card"><h2>Por que R$/km engana e R$/t·km não</h2>'
   +'<p class="cap">A mesma placa aparece cara por quilômetro e barata por tonelada-quilômetro quando roda pesado. Ordenado do mais caro ao mais barato por t·km.</p>'
   +'<div class="tw"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Motorista(s)</th>'
   +'<th class="r">Km</th><th class="r">Litros</th><th class="r">km/l</th><th class="r">Carga t</th>'
   +'<th class="r">t·km</th><th class="r">Carga média</th><th class="r">Diesel R$</th>'
   +'<th class="r">R$/km</th><th class="r">R$/t</th><th class="r">R$/t·km</th><th class="r">Diesel / frete</th></tr></thead><tbody>';
  comT.slice().sort((a,b)=>b.rs_tkm-a.rs_tkm).forEach(v=>{
    h+='<tr><td><button class="lnk" data-pl="'+v.p+'">'+v.p+'</button></td>'
     +'<td style="font-size:12.5px">'+esc(v.m||'—')+'</td>'
     +'<td style="font-size:12px">'+((v.motoristas||[]).map(m=>'<button class="lnk" data-mot="'+esc(m)+'" style="font-family:inherit;font-weight:500">'+esc(m)+'</button>').join('<br>')||'—')+'</td>'
     +'<td class="r mono">'+n0(v.km)+'</td><td class="r mono">'+n0(v.L)+'</td>'
     +'<td class="r mono" style="font-weight:600">'+n3(v.kml)+'</td>'
     +'<td class="r mono">'+n1(v.pesoT)+'</td><td class="r mono">'+n0(v.tkm)+'</td>'
     +'<td class="r mono">'+n1(v.tkm/v.km)+' t</td>'
     +'<td class="r mono">'+rs(v.custo)+'</td>'
     +'<td class="r mono">R$ '+n2(v.custo/v.km)+'</td>'
     +'<td class="r mono">R$ '+n2(v.rs_t)+'</td>'
     +'<td class="r mono" style="font-weight:700">R$ '+n3(v.rs_tkm)+'</td>'
     +'<td class="r mono '+(v.pct_frete==null?'':v.pct_frete>30?'neg':'pos')+'">'+(v.pct_frete==null?'—':n1(v.pct_frete)+'%')+'</td></tr>';});
  h+='</tbody></table></div>'
   +'<div class="note"><b>Carga média</b> é t·km ÷ km — o peso médio que a placa carregou ao longo do trajeto. '
   +'Uma placa com carga média baixa e R$/t·km alto não está gastando demais: está rodando leve ou vazia. '
   +'Quem merece investigação é a placa com carga média parecida e R$/t·km bem maior que a vizinha.</div></div>';

  h+='<div class="grid2" style="margin-top:18px">'
   +'<div class="card"><h2>Custo por tonelada-quilômetro, por placa</h2>'
   +'<p class="cap">Quanto de diesel cada placa queimou para mover uma tonelada por um quilômetro.</p>'
   +(()=>{const cheia=comT.filter(v=>v.tkm/v.km>=3), leve=comT.filter(v=>v.tkm/v.km<3);
     return '<div class="chart">'+hbars(cheia.slice().sort((a,b)=>a.rs_tkm-b.rs_tkm).map(v=>({
      lb:v.p+' · '+n1(v.tkm/v.km)+' t',v:v.rs_tkm,c:'var(--acc)',vl:'R$ '+n3(v.rs_tkm),
      tip:'<b>'+v.p+'</b> · '+esc(v.m||'')+'<br>R$ '+n3(v.rs_tkm)+' por t·km<br>'+n0(v.tkm)+' t·km · carga média '+n1(v.tkm/v.km)+' t'
        +'<br>'+n3(v.kml)+' km/l · '+rs(v.custo)+' de diesel'})),
      {w:600,lw:150,rw:80,labelRight:true,aria:'custo por tonelada-quilômetro'})+'</div>'
     +(leve.length?'<div class="note w"><b>'+leve.length+' placa(s) fora do gráfico</b> por carga média abaixo de 3 t — '

/* ================= COMPONENTES DE MOTORISTA ================= */
function motFiltrados(){
  let L=[];
  if(S.base.has('rank')) L=L.concat(RANK);
  if(S.base.has('parcial')) L=L.concat(PARCIAL);
  if(S.mot) L=L.filter(x=>x.m===S.mot);
  if(S.placa) L=L.filter(x=>x.placas.indexOf(S.placa)>=0);
  if(S.mod) L=L.filter(x=>(x.modelo||'').indexOf(S.mod)>=0);
  return L;
}
function gauge(score){
  return '<div class="gauge"><div class="track"><div class="fill" style="width:'+(score||0)+'%;background:'+corScore(score)+'"></div></div>'
   +'<div class="val" style="color:'+corScore(score)+'">'+(score==null?'—':n0(score))+'</div></div>';
}
function chipMeta(mo){
  if(!mo.meta_lo) return '<span class="tag">sem meta</span>';
  const f=mo.meta_hi&&mo.meta_hi!==mo.meta_lo?n1(mo.meta_lo)+'–'+n1(mo.meta_hi):n2(mo.meta_lo);
  return '<span class="tag" title="'+esc(mo.origem_meta||'')+'">meta '+f+' km/l</span>';
}
function tipMotorista(mo){
  const pr=mo.principais&&mo.principais.length?mo.principais[0]:null;
  return '<b>'+esc(mo.m)+'</b>'
   +'<br>Placa: '+esc(mo.placas.join(', '))
   +'<br>Modelo: '+esc(mo.modelo||'—')
   +'<br>Meta: '+(mo.meta_lo?(mo.meta_hi&&mo.meta_hi!==mo.meta_lo?n1(mo.meta_lo)+'–'+n1(mo.meta_hi):n2(mo.meta_lo))+' km/l':'—')
   +'<br>Consumo: '+(mo.kml?n3(mo.kml)+' km/l':'sem leitura')
   +'<br>Diferença: '+(mo.difp==null?'—':sgn(mo.difp,1)+'%')
   +'<br>Score: '+(mo.score==null?'sem base':n0(mo.score)+'/100 · '+rotuloScore(mo.score))
   +'<br>Eventos: '+(mo.n_seg+mo.n_fad+mo.n_efi)+(mo.ev100!=null?' ('+n0(mo.ev100)+' pts/100 km)':'')
   +(pr?'<br>Melhoria: '+esc(pr[0]):'');
}
function linhaMot(mo,i,cols){
  const pr=mo.principais&&mo.principais.length?mo.principais[0]:null;
  let h='<tr data-tip="'+esc(tipMotorista(mo))+'">';
  if(cols.pos) h+='<td class="r mono">'+(mo.pos||'—')+'</td>';
  h+='<td><button class="lnk" data-motc="'+esc(mo.m)+'" style="font-family:inherit;font-weight:600">'+esc(mo.m)+'</button>'
    +(mo.score==null?' <span class="tag" title="cobertura de score abaixo de 60 pontos">base parcial</span>':'')+'</td>'
   +'<td class="mono" style="font-size:12.5px">'+mo.placas.map(p=>'<button class="lnk" data-pl="'+p+'">'+p+'</button>').join(' ')+'</td>'
   +'<td style="font-size:12.5px;color:var(--ink2)">'+esc(mo.modelo||'—')+'</td>'
   +'<td class="r mono">'+(mo.kml?n3(mo.kml):'—')+'</td>'
   +'<td class="r mono" style="font-size:12.5px">'+(mo.meta_lo?(mo.meta_hi&&mo.meta_hi!==mo.meta_lo?n1(mo.meta_lo)+'–'+n1(mo.meta_hi):n2(mo.meta_lo)):'—')+'</td>'
   +'<td class="r mono '+(mo.difp==null?'':mo.difp<0?'neg':'pos')+'">'+(mo.difp==null?'—':sgn(mo.difp,1)+'%')+'</td>'
   +'<td class="r mono">'+(mo.ader==null?'—':n0(mo.ader)+'%')+'</td>'
   +'<td class="r mono">'+(mo.km?n0(mo.km):'—')+'</td>'
   +'<td class="r mono">'+(mo.n_seg+mo.n_fad+mo.n_efi)+'</td>'
   +'<td class="r mono" title="pontos ponderados de segurança e conduta por 100 km">'+(mo.ev100==null?'—':n0(mo.ev100))+'</td>'
   +'<td class="r mono '+(mo.evol==null?'':mo.evol<0?'neg':'pos')+'">'+(mo.evol==null?'—':sgn(mo.evol,0)+'%')+'</td>'
   +'<td style="min-width:150px">'+gauge(mo.score)+'</td>'
   +'<td style="font-size:12px;color:var(--ink2)">'+(pr?esc(pr[0]):'—')+'</td></tr>';
  return h;
}
function tabelaMot(L,pos){
  if(!L.length) return '<p class="empty">Nenhum motorista com os filtros atuais.</p>';
  let h='<div class="tw"><table><thead><tr>'+(pos?'<th class="r">#</th>':'')
   +'<th>Motorista</th><th>Placa</th><th>Modelo</th><th class="r">Consumo</th><th class="r">Meta</th>'
   +'<th class="r">Dif.</th><th class="r">Aderência</th><th class="r">Km</th><th class="r">Eventos</th>'
   +'<th class="r">Pts/100 km</th><th class="r">Evolução</th><th>Score</th><th>Principal oportunidade</th></tr></thead><tbody>';
  L.forEach((mo,i)=>h+=linhaMot(mo,i,{pos:pos}));
  return h+'</tbody></table></div>';
}

/* ================= PLANO DE AÇÃO — motor ================= */
function planoAcoes(){
  const out=[];
  MOTP.forEach(mo=>{
    for(const ev in (mo.ev||{})){
      const c=CATEV[ev]; if(!c) continue;
      if(c[0]==='Eficiência'&&mo.ev[ev]<3) continue;
      const n=mo.ev[ev], p=prioridadeDe(mo,ev,n);
      out.push({mot:mo.m,score:mo.score,placas:mo.placas,ev:ev,n:n,cat:p.cat,peso:p.peso,
        freq:p.freq,prio:p.prio,orient:c[2],km:mo.km});
    }
  });
  const R={A:0,M:1,B:2};
  out.sort((a,b)=>R[a.prio]-R[b.prio] || b.n*b.peso-a.n*a.peso);
  return out;
}

/* ================= 4. GAMIFICAÇÃO ================= */
function vGame(C,V,T,M){

  const best=(arr,f)=>arr.filter(x=>f(x)!=null).sort((a,b)=>f(b)-f(a))[0];
  let recon=[
    ['🏆','Melhor performance',best(L,x=>x.score),x=>n0(x.score)+' pontos de score'],
    ['🚚','Melhor consumo absoluto',best(L.filter(x=>x.kml),x=>x.kml),x=>n2(x.kml)+' km/l no período'],
    ['📈','Maior evolução',best(L.filter(x=>x.evol!=null&&x.evol>0),x=>x.evol),x=>sgn(x.evol,1)+'% de melhora no período'],
    ['⛽','Menor custo de diesel por km',best(L.filter(x=>x.km&&x.L),x=>-(x.L*S.preco/x.km)),x=>'R$ '+n2(x.L*S.preco/x.km)+' por km rodado'],
    ['🎯','Maior aderência à meta',best(L.filter(x=>x.ader!=null),x=>x.ader),x=>n0(x.ader)+'% da faixa do modelo'],
    ['⭐','Melhor comportamento',best(L.filter(x=>x.ev100!=null),x=>-x.ev100),x=>n0(x.ev100)+' pontos de evento por 100 km'],
    ['🔄','Melhor condução econômica',best(L.filter(x=>x.p_eco!=null),x=>x.p_eco),x=>n0(x.p_eco)+'% do tempo em faixa verde'],
    ['🚀','Destaque do período',best(L.filter(x=>x.km),x=>(x.score||0)*Math.log(1+(x.km||0))),x=>n0(x.km)+' km com score '+n0(x.score)]
  ];
  const semEvol=!recon.find(r=>r[1]==='Maior evolução'&&r[2]);
  recon=recon.filter(r=>r[2]);

  let h='<div class="card"><h2>Pódio do período</h2>'
   +'<p class="cap">O pódio é o score, não o consumo bruto. Cada motorista é medido contra a meta do veículo que dirigiu — quem roda um MAN não compete no mesmo número de quem roda um DAF.</p>'
   +'<div class="podio">';

    const x=L[i]; if(!x)return;
    h+='<div class="pod'+(i===0?' p1':'')+'"><div class="med">'+med+'</div>'
     +'<div class="nm"><button class="lnk" data-motc="'+esc(x.m)+'" style="font-family:inherit;font-weight:700;font-size:15px">'+esc(x.m)+'</button></div>'
     +'<div class="sc" style="color:'+corScore(x.score)+'">'+n0(x.score)+'</div>'
     +'<div class="dt">'+esc(x.placas[0])+' · '+esc(x.modelo||'')+'<br>'+(x.kml?n2(x.kml)+' km/l · '+n0(x.ader)+'% da meta':'sem consumo apurado')+'</div></div>';
  });
  h+='</div>';

  h+='<h3 style="font-size:14px;margin-top:22px">Reconhecimentos do período</h3>'
   +'<p class="cap">Sete categorias diferentes, de propósito: quem evoluiu muito também é reconhecido, mesmo sem estar no topo do ranking.</p>'
   +'<div class="badges">';
  recon.forEach(([ic,tit,x,det])=>{
    h+='<div class="badge" data-tip="'+esc(tipMotorista(x))+'"><div class="ic">'+ic+'</div><div class="tx"><b>'+esc(tit)+'</b>'
     +'<button class="lnk" data-motc="'+esc(x.m)+'" style="font-family:inherit;font-weight:600">'+esc(x.m)+'</button><br>'+esc(det(x))+'</div></div>';
  });
  if(semEvol) h+='<div class="badge" style="flex:1 1 100%;border-style:dashed"><div class="ic">📈</div><div class="tx">'
    +'<b>Maior evolução</b>Sem destaque neste período<br>Nenhum motorista com quatro dias de leitura melhorou o consumo entre a primeira e a segunda metade. '
    +'Com cinco dias de export, a maioria não tem dias suficientes para medir tendência.</div></div>';
  h+='</div></div>';

  h+='<div class="card"><h2>Ranking completo</h2>'
   +'<p class="cap">Score de 0 a 100. Passe o mouse na linha para ver o resumo do motorista; clique no nome para abrir o cartão.</p>'
   +'<div class="chart">'+hbars(L.map(x=>({lb:(x.pos)+'º  '+(x.m.length>22?x.m.slice(0,20)+'…':x.m),v:x.score,c:corScore(x.score),
      vl:n0(x.score)+(x.evol!=null?'   '+(x.evol>=0?'▲':'▼')+n1(Math.abs(x.evol))+'%':''),max:100,

/* ================= 5. PLANO DE AÇÃO ================= */
function vAcao(C,V,T,M){
  let A=planoAcoes();
  if(S.mot) A=A.filter(a=>a.mot===S.mot);
  if(S.placa) A=A.filter(a=>a.placas.indexOf(S.placa)>=0);
  const porMot={}; A.forEach(a=>{(porMot[a.mot]=porMot[a.mot]||[]).push(a);});
  const alta=A.filter(a=>a.prio==='A');

  let h='<div class="kpis">'
  +kpi('c','Motoristas com prioridade alta',n0(new Set(alta.map(a=>a.mot)).size),'','de '+MOTP.length+' no período')
  +kpi('a','Comportamentos mapeados',n0(A.length),'','cada linha vira uma ação')
  +kpi('','Motoristas com plano',n0(Object.keys(porMot).length),'','de '+MOTP.length+' no período')
  +kpi('g','Sem ocorrência',n0(MOTP.length-Object.keys(porMot).length),'','nada a tratar neste período')
  +'</div>';

  // leitura de frota: comportamento que atinge muita gente é campanha, não conversa individual
  const porEv={}; A.forEach(a=>{(porEv[a.ev]=porEv[a.ev]||{n:0,mots:new Set()}); porEv[a.ev].n+=a.n; porEv[a.ev].mots.add(a.mot);});
  const espalhados=Object.keys(porEv).filter(e=>porEv[e].mots.size>=Math.max(4,MOTP.length*0.3))
    .sort((a,b)=>porEv[b].n-porEv[a].n);
  if(espalhados.length){
    h+='<div class="card"><h2>Antes de chamar um por um: o que é problema de frota</h2>'
     +'<p class="cap">Comportamento que aparece em quase todo mundo não se resolve em conversa individual — se resolve em campanha, regra e acompanhamento coletivo. '
     +'Chamar 20 motoristas para tratar o mesmo ponto gasta a gestão e não muda o resultado.</p>'
     +'<div class="tw"><table><thead><tr><th>Comportamento</th><th class="r">Motoristas atingidos</th><th class="r">Ocorrências</th><th>Leitura</th></tr></thead><tbody>';
    espalhados.forEach(e=>{
      h+='<tr><td><b>'+esc(e)+'</b></td><td class="r mono">'+porEv[e].mots.size+' de '+MOTP.length+'</td>'
       +'<td class="r mono">'+n0(porEv[e].n)+'</td>'
       +'<td style="font-size:12.5px;color:var(--ink2)">Presente em '+n0(100*porEv[e].mots.size/MOTP.length)+'% dos motoristas. Tratar como campanha de frota; a conversa individual fica para quem está acima do 3º quartil da própria frota.</td></tr>';});
    h+='</tbody></table></div></div>';
  }
  h+='<div class="note" style="margin-top:18px"><b>Como a prioridade é definida:</b> combina três coisas. O <b>peso</b> do comportamento (uma colisão frontal pesa 3, um cinto nível 1 pesa 1); '
   +'a <b>frequência por 100 km comparada com a própria frota</b> — acima do 3º quartil dos colegas vira Alta, acima da mediana vira Média; '

     +'<td><button class="lnk" data-motc="'+esc(a.mot)+'" style="font-family:inherit;font-weight:600">'+esc(a.mot)+'</button>'

     +'<td class="mono" style="font-size:12.5px">'+esc(a.placas.join(' '))+'</td>'

     +'<td><span class="tag">peso '+a.peso+'</span></td>'
     +'<td style="font-size:12.5px;color:var(--ink2);max-width:46ch">'+esc(a.orient)+'</td>'
     +'<td><span class="tag">A tratar</span></td></tr>';

  h+='</tbody></table></div>'
   +(A.length>120?'<div class="note">Mostrando as 120 primeiras. Filtre por motorista para ver o restante.</div>':'')
   +'</div>';

}

/* ================= 6. MOTORISTA E CARGA ================= */
function tipPlaca(p,C){
  const v=C.V.find(x=>x.p===p)||{};
  const mos=(v.motoristas||[]).map(m=>MOTIDX[m]).filter(Boolean);
  const mo=mos[0];
  let t='<b>'+esc(p)+'</b> · '+esc(v.m||'modelo não identificado');
  if(mo){
    const pr=mo.principais&&mo.principais.length?mo.principais[0]:null;
    t='<b>'+esc(mo.m)+'</b><br><span style="color:var(--ink3)">'+esc(p)+' · '+esc(v.m||'—')+'</span>'
     +'<br>Meta: '+(mo.meta_lo?(mo.meta_hi&&mo.meta_hi!==mo.meta_lo?n1(mo.meta_lo)+'–'+n1(mo.meta_hi):n2(mo.meta_lo))+' km/l':'—')
     +'<br>Consumo: '+(mo.kml?n3(mo.kml)+' km/l':'sem leitura')
     +'<br>Diferença: '+(mo.difp==null?'—':sgn(mo.difp,1)+'%')
     +'<br>Performance: '+(mo.score==null?'base parcial':n0(mo.score)+'/100 · '+rotuloScore(mo.score)+(mo.pos?' · '+mo.pos+'º':''))
     +'<br>Eventos: '+(mo.n_seg+mo.n_fad+mo.n_efi)
     +(pr?'<br>Melhoria: '+esc(pr[0]):'')
     +(mos.length>1?'<br><span style="color:var(--ink3)">outros condutores: '+esc(mos.slice(1).map(x=>x.m).join(', '))+'</span>':'');
  }
  return t;
}

  +kpi('','Carga movimentada',n1(pesoT),'t','peso de cálculo dos romaneios das placas em análise')

     +'<td class="r mono '+(mo.difp==null?'':mo.difp<0?'neg':'pos')+'">'+(mo.difp==null?'—':sgn(mo.difp,0)+'%')+'</td>'

  h+='</tbody></table></div></div>';

  R.slice(0,150).forEach(r=>{
    h+='<tr><td class="mono" style="font-size:12.5px">'+esc(r[0])+'</td><td class="mono">'+r[4].slice(8)+'/'+r[4].slice(5,7)+'</td>'
     +'<td data-tip="'+esc(tipPlaca(r[1],C))+'"><button class="lnk" data-pl="'+r[1]+'">'+r[1]+'</button></td>'

  h+='</tbody></table></div></div>';

}

   +'<div class="note w"><b>O que o score não mede:</b> peso da carga, relevo da rota e trânsito. Cinco dias de dado não permitem separar esses efeitos da condução sem inventar hipótese. '

   +'<tr><td><b>Telemetria Ravex</b> — Evento_Nome</td><td>Comportamento ao volante e tempo por faixa de rotação</td>'
   +'<td class="mono">84 tipos de evento</td>'
   +'<td style="font-size:12.5px;color:var(--ink2)">Depende de o veículo ter os sensores ADAS/DMS ativos. Placa sem câmera não gera evento de fadiga nem de distração — ausência de evento não é sinônimo de condução perfeita.</td></tr>'

   +'<td class="mono">15 de 93 placas</td>'

   +'Somados, reproduzem o painel "Tempo por faixa" da própria Ravex com diferença abaixo de 1%. É daí que sai o percentual de condução em faixa verde de cada motorista.</div></div>';
  return h;
}

/* ================= WIRING ================= */
const TABS=[['dir','Diretoria'],['mot','Motoristas'],['card','Cartão do motorista'],
  ['game','Gamificação'],['acao','Plano de ação'],['motcarga','Motorista e carga'],
  ['frota','Frota e contexto'],['dados','Qualidade do dado'],['metodo','Metodologia']];
const VIEW={dir:vDir,mot:vMotoristas,card:vCard,game:vGame,acao:vAcao,motcarga:vMotCarga,
  frota:vFrota,dados:vDados,metodo:function(C,V,T,M){return vMetodoNovo(C,V,T,M)+vMetodoAntigo(C,V,T,M);}};

function initControles(){
  const mod=document.getElementById('f_mod');
  mod.insertAdjacentHTML('beforeend','<option value="">Todos os modelos</option>');
  MODS.forEach(m=>mod.insertAdjacentHTML('beforeend','<option value="'+esc(m)+'">'+esc(m)+'</option>'));
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    '<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'">'+l+'</button>').join('');
  mod.addEventListener('change',()=>{S.mod=mod.value; S.placa=''; render();});
  document.getElementById('f_pl').addEventListener('change',e=>{S.placa=e.target.value; render();});
  document.getElementById('f_base').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return;
    const on=b.getAttribute('aria-pressed')==='true';
    if(on&&S.base.size===1)return;
    if(on)S.base.delete(b.dataset.b); else S.base.add(b.dataset.b);
    render();});
  document.getElementById('f_st').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return;
    const on=b.getAttribute('aria-pressed')==='true';
    if(on&&S.st.size===1)return;
    if(on)S.st.delete(b.dataset.st); else S.st.add(b.dataset.st);
    render();});
  document.getElementById('f_reset').addEventListener('click',()=>{
    S.de=0;S.ate=DIAS.length-1;S.mod='';S.placa='';S.mot='';document.getElementById('f_mot').value='';S.st=new Set(['Alta','Media','Baixa']);
    S.refs=Object.assign({},D.refs); S.faixas=JSON.parse(JSON.stringify(D.faixas||{}));
    de.value=0;ate.value=DIAS.length-1;mod.value='';render();});
  document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(!b)return;
    S.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:'instant'});});
  document.addEventListener('click',e=>{
    const pl=e.target.closest('[data-pl]');
    if(pl){ S.placa=S.placa===pl.dataset.pl?'':pl.dataset.pl;
      const v=D.veic.find(x=>x.p===pl.dataset.pl);
      if(S.placa&&v&&!S.st.has(v.q))S.st.add(v.q);
      render(); return;}
    const rk=e.target.closest('#segrank button');
    if(rk){S.rank=rk.dataset.r; render(); return;}
    const dd=e.target.closest('#segdia button');
    if(dd){S.diaOrd=dd.dataset.d; render(); return;}
    const mo=e.target.closest('#segmot button');
    if(mo){S.motOrd=mo.dataset.o; render(); return;}
    const mc=e.target.closest('[data-motc]');
    if(mc){ S.mot=mc.dataset.motc; S.placa=''; S.tab='card';
      if(MOTIDX[S.mot]&&MOTIDX[S.mot].score==null) S.base.add('parcial');
      document.getElementById('f_mot').value=S.mot; render(); window.scrollTo({top:0,behavior:'instant'}); return;}
    const so=e.target.closest('#segmotord button');
    if(so){S.motOrd=so.dataset.o; render(); return;}
    const mm=e.target.closest('[data-mot]');
    if(mm){ S.mot=S.mot===mm.dataset.mot?'':mm.dataset.mot; S.placa='';
      document.getElementById('f_mot').value=S.mot; render();}
  });
  document.addEventListener('change',e=>{
    if(e.target.dataset&&e.target.dataset.fx){
      const m=e.target.dataset.fx, lim=e.target.dataset.lim, v=parseFloat(e.target.value);
      if(isFinite(v)&&v>0){
        const f=S.faixas[m];
        if(lim==='p') f.piso=v;
        else { f.alvo[+lim]=v; if(f.alvo[0]>f.alvo[1]) f.alvo=[Math.min(f.alvo[0],f.alvo[1]),Math.max(f.alvo[0],f.alvo[1])]; }
        S.refs[m]=f.alvo[0]; render();
      }
      return;
    }
    if(e.target.dataset&&e.target.dataset.ref){
      const v=parseFloat(e.target.value);
      if(isFinite(v)&&v>0){S.refs[e.target.dataset.ref]=v; render();}}
    if(e.target.id==='f_card'){S.mot=e.target.value; document.getElementById('f_mot').value=S.mot; render(); return;}
    if(e.target.id==='in_preco'){const v=parseFloat(e.target.value); if(isFinite(v)&&v>0){S.preco=v; render();}}
  });
}
function render(){
  const C=compute();
  const V=filtra(C.V), T=totais(V), M=porModelo(V);
  const pl=document.getElementById('f_pl');
  const opts=C.V.filter(v=>(!S.mod||v.m===S.mod)&&S.st.has(v.q)&&(!S.mot||(MOTPLACAS[S.mot]&&MOTPLACAS[S.mot].has(v.p)))).map(v=>v.p).sort();
  pl.innerHTML='<option value="">Todas as placas</option>'+opts.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
  pl.value=S.placa;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  document.querySelectorAll('#f_st .chip').forEach(b=>b.setAttribute('aria-pressed',String(S.st.has(b.dataset.st))));
  document.querySelectorAll('#f_base .chip').forEach(b=>b.setAttribute('aria-pressed',String(S.base.has(b.dataset.b))));
  document.getElementById('pillveic').textContent=RANK.length+' motoristas ranqueáveis · '+PARCIAL.length+' com base parcial';
  document.getElementById('pillref').textContent='Diesel R$ '+n2(S.preco)+'/L';
  const partes=['04 a 08 set 2026',S.mot||'todos os motoristas',S.mod||'todos os modelos',
    S.placa||'todas as placas',
    S.base.size===2?'ranqueáveis e base parcial':(S.base.has('rank')?'só ranqueáveis':'só base parcial')];
  document.getElementById('fnote').textContent='Mostrando '+partes.join(' · ')+' — '
    +motFiltrados().length+' motorista(s), '+n0(T.km)+' km e '+n0(T.L)+' L apurados pelo contador CAN.';
  TABS.forEach(([k])=>{const el=document.getElementById('v-'+k); el.hidden=(k!==S.tab); el.innerHTML='';});
  const host=document.getElementById('v-'+S.tab);
  host.innerHTML=VIEW[S.tab](C,V,T,M);
  host.querySelectorAll('.chart').forEach(tipify);
  tipify(host);
}
function ajustaSticky(){
  const hd=document.querySelector('header');
  if(hd) document.documentElement.style.setProperty('--hdrh',hd.offsetHeight+'px');
}
initControles();
render();
ajustaSticky();
addEventListener('resize',ajustaSticky);
const li=document.querySelector('.brand img');
if(li&&!li.complete) li.addEventListener('load',ajustaSticky);
})();
</script>
